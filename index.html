<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رحلة المفاجأة</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');

    :root {
      --bg1: #100000;
      --bg2: #330404;
      --bg3: #710d0d;
      --bg4: #190000;
      --main: #ff2525;
      --main2: #ff6b6b;
      --darkRed: #9b0000;
      --gold: #ffd27d;
      --green: #8dffbc;
      --bad: #ffc0c0;
      --white: #fff7f7;
      --muted: rgba(255,255,255,.74);
      --glass: rgba(255,255,255,.12);
      --border: rgba(255,255,255,.22);
      --shadow: 0 25px 80px rgba(0,0,0,.45);
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
      font-family: "Tajawal", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--white);
      background:
        radial-gradient(circle at 15% 10%, rgba(255,37,37,.48), transparent 28%),
        radial-gradient(circle at 85% 12%, rgba(255,210,125,.20), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(155,0,0,.45), transparent 38%),
        linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3), var(--bg4));
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,.15) 1px, transparent 1px);
      background-size: 26px 26px;
      opacity: .14;
      pointer-events: none;
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(to bottom, transparent, rgba(0,0,0,.35)),
        radial-gradient(circle at center, transparent, rgba(0,0,0,.25));
      pointer-events: none;
      z-index: -1;
    }

    .secret-skip {
      position: fixed;
      left: 8px;
      bottom: 8px;
      width: 48px;
      height: 48px;
      opacity: 0.015;
      background: transparent;
      border: 0;
      color: transparent;
      box-shadow: none;
      z-index: 99999;
      padding: 0;
      cursor: pointer;
    }

    .secret-skip:hover {
      opacity: 0.04;
      transform: none;
    }

    .float-area,
    .confetti-area {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .heart {
      position: absolute;
      bottom: -80px;
      font-size: 22px;
      opacity: .75;
      animation: heartFloat linear infinite;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,.35));
    }

    @keyframes heartFloat {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      12% { opacity: .85; }
      100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 16px;
      top: -30px;
      border-radius: 4px;
      animation: fall 3s linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(760deg); opacity: 0; }
    }

    .wrap {
      width: min(1060px, calc(100% - 26px));
      margin: auto;
      min-height: 100vh;
      position: relative;
      z-index: 2;
      padding: 22px 0 45px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 999px;
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
      font-weight: 900;
    }

    .brand span {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--main), var(--gold));
      color: #2b0505;
      font-size: 20px;
    }

    button {
      border: 0;
      cursor: pointer;
      border-radius: 18px;
      padding: 15px 20px;
      color: #2b0505;
      background: linear-gradient(135deg, var(--gold), #fff0bf);
      font-weight: 900;
      font-size: 17px;
      box-shadow: 0 16px 34px rgba(0,0,0,.25);
      transition: .22s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button.secondary {
      color: white;
      background: rgba(255,255,255,.12);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    .reset-btn {
      color: white;
      background: rgba(255,255,255,.10);
      border: 1px solid var(--border);
      box-shadow: none;
      padding: 12px 15px;
      border-radius: 17px;
    }

    .progress-box {
      background: rgba(255,255,255,.10);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 15px;
      margin-bottom: 18px;
      backdrop-filter: blur(14px);
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-weight: 900;
      color: rgba(255,255,255,.9);
      margin-bottom: 10px;
      font-size: 15px;
    }

    .progress-line {
      height: 13px;
      background: rgba(255,255,255,.13);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-line span {
      height: 100%;
      width: 0%;
      display: block;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--main), var(--gold));
      transition: .35s ease;
    }

    .page {
      min-height: calc(100vh - 170px);
      display: grid;
      place-items: center;
      animation: pageIn .35s ease both;
    }

    @keyframes pageIn {
      from { opacity: 0; transform: translateY(12px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card {
      width: 100%;
      background: linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.065));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      overflow: hidden;
      position: relative;
    }

    .card::before {
      content: "";
      position: absolute;
      width: 360px;
      height: 360px;
      right: -160px;
      top: -160px;
      background: radial-gradient(circle, rgba(255,37,37,.50), transparent 65%);
      pointer-events: none;
    }

    .card::after {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      left: -135px;
      bottom: -135px;
      background: radial-gradient(circle, rgba(255,210,125,.28), transparent 65%);
      pointer-events: none;
    }

    .card-inner {
      position: relative;
      z-index: 2;
      padding: clamp(22px, 4vw, 42px);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: rgba(255,255,255,.12);
      border: 1px solid var(--border);
      padding: 10px 15px;
      border-radius: 999px;
      color: var(--gold);
      font-weight: 900;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 68px);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -1px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: clamp(28px, 4.3vw, 48px);
      line-height: 1.15;
      font-weight: 900;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 2;
      font-size: 18px;
    }

    .hero-desc {
      margin-top: 18px;
      max-width: 850px;
      font-size: 20px;
    }

    .names {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0 0;
    }

    .pill {
      padding: 12px 16px;
      border-radius: 18px;
      background: rgba(255,255,255,.12);
      border: 1px solid var(--border);
      font-weight: 900;
    }

    .locked-news {
      margin-top: 24px;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,210,125,.28);
      border-radius: 24px;
      padding: 18px;
    }

    .locked-news-title {
      color: var(--gold);
      font-weight: 900;
      font-size: 19px;
      margin-bottom: 8px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .step-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .step-number {
      min-width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: 19px;
      color: #2b0505;
      background: linear-gradient(135deg, var(--main), var(--gold));
      font-weight: 900;
      font-size: 20px;
      box-shadow: 0 14px 26px rgba(255,37,37,.28);
    }

    .step-mini {
      text-align: left;
      color: rgba(255,255,255,.72);
      font-weight: 800;
      line-height: 1.6;
      font-size: 14px;
    }

    .question {
      margin: 18px 0 18px;
      padding: 18px;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 24px;
      color: rgba(255,255,255,.9);
      font-size: 20px;
      line-height: 2;
      font-weight: 700;
    }

    input {
      width: 100%;
      border: 1px solid rgba(255,255,255,.25);
      outline: none;
      border-radius: 20px;
      padding: 16px 18px;
      background: rgba(0,0,0,.26);
      color: white;
      font-size: 18px;
      font-weight: 800;
      margin-top: 6px;
    }

    input::placeholder {
      color: rgba(255,255,255,.45);
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .choice {
      min-height: 70px;
      color: white;
      background: rgba(255,255,255,.11);
      border: 1px solid var(--border);
      box-shadow: none;
      text-align: center;
    }

    .choice.selected {
      color: #2b0505;
      background: linear-gradient(135deg, var(--main2), var(--gold));
    }

    .box-game {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 16px;
    }

    .gift-box {
      min-height: 120px;
      border-radius: 24px;
      color: white;
      background: rgba(255,255,255,.11);
      border: 1px solid var(--border);
      box-shadow: none;
      display: grid;
      place-items: center;
      font-size: 46px;
    }

    .gift-box.selected {
      color: #2b0505;
      background: linear-gradient(135deg, var(--main2), var(--gold));
      transform: translateY(-2px) scale(.98);
    }

    .message {
      min-height: 30px;
      margin-top: 14px;
      font-weight: 900;
      font-size: 16px;
    }

    .message.good { color: var(--green); }
    .message.bad { color: var(--bad); }

    .hint {
      display: none;
      margin-top: 14px;
      padding: 14px 16px;
      background: rgba(255,210,125,.12);
      border: 1px solid rgba(255,210,125,.35);
      border-radius: 18px;
      color: rgba(255,245,220,.95);
      font-weight: 800;
      line-height: 1.8;
    }

    .hint.show {
      display: block;
      animation: pageIn .25s ease both;
    }

    .final-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      margin-top: 18px;
    }

    .mini-card {
      background: linear-gradient(145deg, rgba(255,255,255,.15), rgba(255,255,255,.07));
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 22px;
      backdrop-filter: blur(14px);
      box-shadow: 0 16px 45px rgba(0,0,0,.24);
    }

    .mini-card.full {
      grid-column: 1 / -1;
    }

    .mini-card h3 {
      margin: 0 0 12px;
      font-size: 25px;
      color: var(--gold);
    }

    .letter {
      white-space: pre-line;
      font-size: 18px;
      color: rgba(255,255,255,.88);
      line-height: 2.15;
      font-weight: 600;
    }

    audio {
      width: 100%;
      margin-top: 14px;
    }

    .video-list {
      display: grid;
      gap: 14px;
    }

    .video-box {
      overflow: hidden;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.24);
    }

    .video-title {
      padding: 12px 14px;
      font-weight: 900;
      color: var(--gold);
      border-bottom: 1px solid rgba(255,255,255,.11);
    }

    .video-box iframe,
    .video-box video {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      border: 0;
      background: black;
    }

    .empty-media {
      padding: 18px;
      line-height: 1.8;
      color: rgba(255,255,255,.75);
      font-weight: 800;
    }

    .memory-list {
      display: grid;
      gap: 10px;
    }

    .memory {
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      padding: 14px;
      line-height: 1.8;
      color: rgba(255,255,255,.88);
      font-weight: 800;
    }

    .secret-news {
      margin-top: 18px;
      padding: 20px;
      border-radius: 26px;
      border: 1px dashed rgba(255,210,125,.75);
      background: rgba(255,210,125,.11);
      color: rgba(255,255,255,.95);
      font-size: 20px;
      line-height: 2;
      font-weight: 900;
    }

    .footer {
      text-align: center;
      color: rgba(255,255,255,.58);
      font-weight: 900;
      margin-top: 24px;
      line-height: 1.8;
    }

    @media (max-width: 820px) {
      .topbar {
        align-items: stretch;
        flex-direction: column;
      }

      .brand,
      .reset-btn {
        width: 100%;
        justify-content: center;
      }

      .choices,
      .final-grid {
        grid-template-columns: 1fr;
      }

      .box-game {
        grid-template-columns: 1fr;
      }

      .buttons {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      .secret-skip {
        width: 52px;
        height: 52px;
      }

      .step-head {
        align-items: flex-start;
      }

      .step-mini {
        text-align: right;
      }
    }
  </style>
</head>

<body>
  <button class="secret-skip" onclick="secretSkip()" aria-label="secret">.</button>

  <div class="float-area" id="floatArea"></div>
  <div class="confetti-area" id="confettiArea"></div>

  <main class="wrap">
    <div class="topbar">
      <div class="brand">
        <span>❤️</span>
        <div id="brandText">رحلة المفاجأة</div>
      </div>

    <div class="progress-box">

        <div id="progressLabel">جاهزة البداية</div>

      <div class="progress-line">
        <span id="progressBar"></span>
      </div>
    </div>

    <section id="app"></section>

    <div class="footer" id="footerText"></div>
  </main>

ما كنت أبي أقول لك الخبر من البداية.

الألغاز، الاختبارات، الأغنية، الفيديوهات، والكلام.
كلها عشان أقول لك إنك غالية وتستاهلين شيء خاص.

— سيف`,

          answers: ["دوام"],

        },
        {
          type: "text",
          title: "اختبار الشيء الرسمي",
          badge: "قربنا",
          question: "شيء يكون عند الشخص ويرجعه بالنهاية، وش اسمه؟",
          placeholder: "اكتبي الجواب",
          answers: ["العهدة", "عهدة", "العهد"],
          hint: "تبدأ بـ العـ..."
        },
        {
          type: "text",
          title: "اختبار القطعة",
          badge: "آخر مفتاح",
          question: "قطعة لبس مرتبطة بالخبر المخفي، وش هي؟",
          placeholder: "اكتبي اسم القطعة",
          answers: ["السديري", "سديري"],
          hint: "قطعة تلبس فوق الملابس."
        },
        {
          type: "choice",
          title: "اختبار التوقع",
          badge: "وش صار واضح؟",
          question: "الحين الخبر المخفي صار قريب. وش تتوقعين وراه؟",
          choices: ["شيء عادي", "مفاجأة لك", "خطأ بالموقع", "اختبار رياضيات"],
          answers: ["مفاجأة لك"],
          hint: "أكيد مو رياضيات."
        },
        {
          type: "text",
          title: "الاختبار الأخير",
          badge: "فتح النهاية",
          question: "اكتبي الجملة: افتح المفاجأة",
          placeholder: "اكتبي الجملة",
          answers: ["افتح المفاجأة", "افتح المفاجاه", "إفتح المفاجأة", "إفتح المفاجاه"],
          hint: "انسخي الجملة من السؤال."
        }
      ]
    };

    const app = document.getElementById("app");
    const progressBar = document.getElementById("progressBar");
    const progressCount = document.getElementById("progressCount");
    const progressLabel = document.getElementById("progressLabel");
    const brandText = document.getElementById("brandText");
    const footerText = document.getElementById("footerText");

    let current = Number(localStorage.getItem("secret_current_step") || 0);
    let selectedChoice = "";
    let selectedBox = "";

    let secretSkipClicks = 0;
    let secretSkipTimer = null;

    brandText.textContent = SITE.title;
    footerText.textContent = `صنع بحب من ${SITE.senderName} إلى ${SITE.loverName}`;

    function secretSkip() {
      secretSkipClicks++;

      clearTimeout(secretSkipTimer);
      secretSkipTimer = setTimeout(() => {
        secretSkipClicks = 0;
      }, 1800);

      if (secretSkipClicks >= 5) {
        secretSkipClicks = 0;
        localStorage.setItem("secret_current_step", String(SITE.tests.length + 1));
        setStep(SITE.tests.length + 1);
      }
    }

    function normalizeText(value) {
      return String(value || "")
        .trim()
        .replace(/[ًٌٍَُِّْ]/g, "")
        .replace(/[إأآا]/g, "ا")
        .replace(/ى/g, "ي")
        .replace(/ة/g, "ه")
        .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
        .replace(/\s+/g, " ")
        .toLowerCase();
    }

    function answerIsCorrect(input, answers) {
      const cleaned = normalizeText(input);
      return answers.some(ans => normalizeText(ans) === cleaned);
    }

    function setStep(step) {
      current = step;
      localStorage.setItem("secret_current_step", String(current));
      selectedChoice = "";
      selectedBox = "";
      window.location.hash = current === 0 ? "start" : current > SITE.tests.length ? "gift" : `test-${current}`;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function updateProgress() {
      const total = SITE.tests.length;
      const solved = Math.min(Math.max(current - 1, 0), total);
      const percent = total === 0 ? 100 : (solved / total) * 100;

      progressBar.style.width = percent + "%";
      progressCount.textContent = `${solved} / ${total}`;

      if (current === 0) {
        progressLabel.textContent = "جاهزة البداية";
      } else if (current > total) {
        progressLabel.textContent = "تم فتح المفاجأة";
      } else {
        progressLabel.textContent = `اختبار ${current} من ${total}`;
      }
    }

    function render() {
      updateProgress();

      if (current === 0) {
        renderIntro();
        return;
      }

      if (current > SITE.tests.length) {
        renderFinal();
        return;
      }

      renderTest(SITE.tests[current - 1], current);
    }

    function renderIntro() {
      app.innerHTML = `
        <section class="page">
          <div class="card">
            <div class="card-inner">
              <div class="tag">❤️ رسالة مقفلة</div>
              <h1>فيه شيء مخفي… وما راح تعرفينه من البداية</h1>

              <p class="hero-desc">
                قدامك رحلة اختبارات قصيرة. كل اختبار يفتح لك اللي بعده،
                وكل إجابة تقرّبك من السر الحقيقي. الخبر ما راح ينقال بسهولة،
                لازم توصلين له بنفسك.
              </p>

              <div class="names">
                <div class="pill">إلى: ${SITE.loverName}</div>
                <div class="pill">من: ${SITE.senderName}</div>
              </div>

              <div class="locked-news">
                <div class="locked-news-title">🔒 الخبر مقفل</div>
                <p>
                  الخبر الحقيقي مخفي الآن. افتحي الاختبارات واحد واحد،
                  وبعدها بتعرفين وش المقصود.
                </p>
              </div>

              <div class="buttons">
                <button onclick="setStep(1)">ابدئي الاختبارات</button>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    function renderTest(test, index) {
      let body = "";

      if (test.type === "text") {
        body = `
          <input id="answerInput" placeholder="${test.placeholder || "اكتبي الجواب"}" autocomplete="off" />
          <div class="buttons">
            <button onclick="checkTextAnswer(${index})">تحقق</button>
            <button class="secondary" onclick="showHint()">تلميح</button>
          </div>
        `;
      }

      if (test.type === "choice") {
        body = `
          <div class="choices">
            ${test.choices.map(choice => `
              <button class="choice" onclick="selectChoice(this, '${escapeForAttr(choice)}')">${choice}</button>
            `).join("")}
          </div>
          <div class="buttons">
            <button onclick="checkChoiceAnswer(${index})">اعتماد</button>
            <button class="secondary" onclick="showHint()">تلميح</button>
          </div>
        `;
      }

      if (test.type === "box") {
        body = `
          <div class="box-game">
            ${test.boxes.map(box => `
              <button class="gift-box" onclick="selectBox(this, '${escapeForAttr(box.value)}')">${box.icon}</button>
            `).join("")}
          </div>
          <div class="buttons">
            <button onclick="checkBoxAnswer(${index})">اعتماد الصندوق</button>
            <button class="secondary" onclick="showHint()">تلميح</button>
          </div>
        `;
      }

      app.innerHTML = `
        <section class="page">
          <div class="card">
            <div class="card-inner">
              <div class="step-head">
                <div class="step-number">${index}</div>
                <div class="step-mini">
                  ${test.badge || "اختبار"}<br>
                  صفحة ${index} من ${SITE.tests.length}
                </div>
              </div>

              <div class="tag">🔐 ${test.title}</div>
              <h2>${test.title}</h2>

              <div class="question">${test.question}</div>

              ${body}

              <div class="hint" id="hintBox">💡 ${test.hint || "فكري شوي وبتعرفين."}</div>
              <div class="message" id="messageBox"></div>

              <div class="buttons">
                ${index > 1 ? `<button class="secondary" onclick="setStep(${index - 1})">رجوع</button>` : `<button class="secondary" onclick="setStep(0)">رجوع للبداية</button>`}
              </div>
            </div>
          </div>
        </section>
      `;

      if (test.type === "text") {
        setTimeout(() => {
          const input = document.getElementById("answerInput");
          if (input) {
            input.focus();
            input.addEventListener("keydown", e => {
              if (e.key === "Enter") checkTextAnswer(index);
            });
          }
        }, 100);
      }
    }

    function checkTextAnswer(index) {
      const test = SITE.tests[index - 1];
      const input = document.getElementById("answerInput");
      const msg = document.getElementById("messageBox");

      if (!input || !msg) return;

      if (answerIsCorrect(input.value, test.answers)) {
        msg.className = "message good";
        msg.textContent = "صح! نروح للاختبار اللي بعده ❤️";
        miniConfetti();
        setTimeout(() => setStep(index + 1), 650);
      } else {
        msg.className = "message bad";
        msg.textContent = "مو صح، جربي مرة ثانية.";
      }
    }

    function selectChoice(btn, choice) {
      selectedChoice = choice;
      document.querySelectorAll(".choice").forEach(el => el.classList.remove("selected"));
      btn.classList.add("selected");
    }

    function checkChoiceAnswer(index) {
      const test = SITE.tests[index - 1];
      const msg = document.getElementById("messageBox");

      if (!selectedChoice) {
        msg.className = "message bad";
        msg.textContent = "اختاري جواب أول.";
        return;
      }

      if (answerIsCorrect(selectedChoice, test.answers)) {
        msg.className = "message good";
        msg.textContent = "صح عليك! كملي ❤️";
        miniConfetti();
        setTimeout(() => setStep(index + 1), 650);
      } else {
        msg.className = "message bad";
        msg.textContent = "لا، اختاري غيره.";
      }
    }

    function selectBox(btn, value) {
      selectedBox = value;
      document.querySelectorAll(".gift-box").forEach(el => el.classList.remove("selected"));
      btn.classList.add("selected");
    }

    function checkBoxAnswer(index) {
      const test = SITE.tests[index - 1];
      const msg = document.getElementById("messageBox");

      if (!selectedBox) {
        msg.className = "message bad";
        msg.textContent = "اختاري صندوق أول.";
        return;
      }

      if (answerIsCorrect(selectedBox, test.answers)) {
        msg.className = "message good";
        msg.textContent = "صح! هذا الصندوق المطلوب ❤️";
        miniConfetti();
        setTimeout(() => setStep(index + 1), 650);
      } else {
        msg.className = "message bad";
        msg.textContent = "الصندوق غلط، جربي صندوق ثاني.";
      }
    }

    function showHint() {
      const hint = document.getElementById("hintBox");
      if (hint) hint.classList.add("show");
    }

    function renderFinal() {
      updateProgress();
      fireConfetti();

      const videosHTML = SITE.videos.map(video => {
        if (video.type === "youtube") {
          if (!video.value || video.value === "PUT_YOUTUBE_ID_HERE") {
            return `
              <div class="video-box">
                <div class="video-title">${video.title}</div>
                <div class="empty-media">حط ID اليوتيوب في أعلى الكود مكان PUT_YOUTUBE_ID_HERE.</div>
              </div>
            `;
          }

          return `
            <div class="video-box">
              <div class="video-title">${video.title}</div>
              <iframe
                src="https://www.youtube.com/embed/${video.value}"
                allowfullscreen
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
              </iframe>
            </div>
          `;
        }

        return `
          <div class="video-box">
            <div class="video-title">${video.title}</div>
            <video controls src="${video.value}"></video>
          </div>
        `;
      }).join("");

      app.innerHTML = `
        <section class="page">
          <div class="card">
            <div class="card-inner">
              <div class="tag">🎁 تم فتح المفاجأة</div>
              <h1>وصلتي للنهاية يا ${SITE.loverName}</h1>

              <p class="hero-desc">
                الحين بس ينكشف الخبر الحقيقي، بعد ما خلصتي كل الاختبارات.
              </p>

              <div class="secret-news">
                🗞️ الخبر الحقيقي:
                <br>
                بكرا آخر دوام، وبكرا تسليم العهدة والسديري…
                بس المفاجأة الأكبر إن فيه هدية وإهداء معمول لك أنتِ.
              </div>

              <div class="secret-news">
                ${SITE.giftText}
              </div>

              <div class="final-grid">
                <div class="mini-card full">
                  <h3>💌 رسالتي لك</h3>
                  <div class="letter">${SITE.finalLetter}</div>
                </div>

                <div class="mini-card">
                  <h3>🎵 الأغنية</h3>
                  <p>
                    شغلي الأغنية مع الرسالة.
                    إذا ما اشتغلت، تأكدي إن ملف <b>song.mp3</b> جنب ملف الموقع.
                  </p>
                  <audio controls src="${SITE.songUrl}"></audio>
                </div>

                <div class="mini-card">
                  <h3>✨ أشياء مخفية في الرحلة</h3>
                  <div class="memory-list">
                    ${SITE.memories.map(item => `<div class="memory">${item}</div>`).join("")}
                  </div>
                </div>

                <div class="mini-card full">
                  <h3>🎬 الفيديوهات</h3>
                  <div class="video-list">
                    ${videosHTML}
                  </div>
                </div>
              </div>

              <div class="buttons">
                <button onclick="fireConfetti()">احتفال مرة ثانية 🎉</button>
                <button class="secondary" onclick="setStep(0)">إعادة الرحلة</button>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    function escapeForAttr(text) {
      return String(text)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;");
    }

    function miniConfetti() {
      const area = document.getElementById("confettiArea");
      const colors = ["#ff2525", "#ff6868", "#ffd27d", "#ffffff", "#85ffbd"];

      for (let i = 0; i < 28; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti";
        piece.style.left = Math.random() * 100 + "%";
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = (1.2 + Math.random() * 1.2) + "s";
        piece.style.transform = `rotate(${Math.random() * 180}deg)`;
        area.appendChild(piece);

        setTimeout(() => piece.remove(), 2600);
      }
    }

    function fireConfetti() {
      const area = document.getElementById("confettiArea");
      const colors = ["#ff2525", "#ff6868", "#b30000", "#ffd27d", "#ffffff", "#85ffbd"];

      for (let i = 0; i < 100; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti";
        piece.style.left = Math.random() * 100 + "%";
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = (1.9 + Math.random() * 1.8) + "s";
        piece.style.animationDelay = (Math.random() * .25) + "s";
        piece.style.transform = `rotate(${Math.random() * 360}deg)`;
        area.appendChild(piece);

        setTimeout(() => piece.remove(), 4200);
      }
    }

    function makeHearts() {
      const area = document.getElementById("floatArea");
      const icons = ["❤️", "♥️", "💌", "✨", "🎁", "🌹", "🔥"];

      for (let i = 0; i < 24; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.textContent = icons[Math.floor(Math.random() * icons.length)];
        heart.style.left = Math.random() * 100 + "%";
        heart.style.animationDuration = (8 + Math.random() * 9) + "s";
        heart.style.animationDelay = (Math.random() * 7) + "s";
        heart.style.fontSize = (16 + Math.random() * 18) + "px";
        area.appendChild(heart);
      }
    }

    function resetJourney() {
      const ok = confirm("تبغى ترجع الرحلة من البداية؟");
      if (!ok) return;

      localStorage.removeItem("secret_current_step");
      current = 0;
      selectedChoice = "";
      selectedBox = "";
      render();
    }

    makeHearts();
    render();
  </script>
</body>
</html>
