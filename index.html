<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رحلة المفاجأة</title>

  <meta name="description" content="رحلة مفاجأة سرية" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="رحلة المفاجأة" id="ogTitle" />
  <meta property="og:description" content="رحلة مفاجأة سرية" id="ogDescription" />
  <meta property="og:image" content="" id="ogImage" />
  <meta property="og:url" content="" id="ogUrl" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="رحلة المفاجأة" id="twitterTitle" />
  <meta name="twitter:description" content="رحلة مفاجأة سرية" id="twitterDescription" />
  <meta name="twitter:image" content="" id="twitterImage" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');

    :root {
      --bg1: #100000;
      --bg2: #330404;
      --bg3: #710d0d;
      --bg4: #190000;
      --main: #ff2525;
      --main2: #ff6b6b;
      --gold: #ffd27d;
      --green: #8dffbc;
      --bad: #ffc0c0;
      --white: #fff7f7;
      --muted: rgba(255,255,255,.74);
      --glass: rgba(255,255,255,.12);
      --border: rgba(255,255,255,.22);
      --shadow: 0 25px 80px rgba(0,0,0,.45);
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
      font-family: "Tajawal", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--white);
      background:
        radial-gradient(circle at 15% 10%, color-mix(in srgb, var(--main) 50%, transparent), transparent 28%),
        radial-gradient(circle at 85% 12%, rgba(255,210,125,.20), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(155,0,0,.45), transparent 38%),
        linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3), var(--bg4));
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,.15) 1px, transparent 1px);
      background-size: 26px 26px;
      opacity: .14;
      pointer-events: none;
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(to bottom, transparent, rgba(0,0,0,.35)),
        radial-gradient(circle at center, transparent, rgba(0,0,0,.25));
      pointer-events: none;
      z-index: -1;
    }

    .secret-skip {
      position: fixed;
      left: 8px;
      bottom: 8px;
      width: 48px;
      height: 48px;
      opacity: 0.015;
      background: transparent;
      border: 0;
      color: transparent;
      box-shadow: none;
      z-index: 99999;
      padding: 0;
      cursor: pointer;
    }

    .float-area,
    .confetti-area {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .heart {
      position: absolute;
      bottom: -80px;
      font-size: 22px;
      opacity: .75;
      animation: heartFloat linear infinite;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,.35));
    }

    @keyframes heartFloat {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      12% { opacity: .85; }
      100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 16px;
      top: -30px;
      border-radius: 4px;
      animation: fall 3s linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(760deg); opacity: 0; }
    }

    .wrap {
      width: min(1060px, calc(100% - 26px));
      margin: auto;
      min-height: 100vh;
      position: relative;
      z-index: 2;
      padding: 22px 0 45px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 999px;
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
      font-weight: 900;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--main), var(--gold));
      color: #2b0505;
      font-size: 20px;
      object-fit: cover;
      overflow: hidden;
    }

    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    button {
      border: 0;
      cursor: pointer;
      border-radius: 18px;
      padding: 15px 20px;
      color: #2b0505;
      background: linear-gradient(135deg, var(--gold), #fff0bf);
      font-weight: 900;
      font-size: 17px;
      box-shadow: 0 16px 34px rgba(0,0,0,.25);
      transition: .22s ease;
    }

    button:hover { transform: translateY(-2px); }

    button.secondary {
      color: white;
      background: rgba(255,255,255,.12);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    button.danger {
      color: white;
      background: rgba(255, 50, 50, .22);
      border: 1px solid rgba(255, 150, 150, .35);
      box-shadow: none;
    }

    .reset-btn {
      color: white;
      background: rgba(255,255,255,.10);
      border: 1px solid var(--border);
      box-shadow: none;
      padding: 12px 15px;
      border-radius: 17px;
    }

    .progress-box {
      background: rgba(255,255,255,.10);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 15px;
      margin-bottom: 18px;
      backdrop-filter: blur(14px);
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-weight: 900;
      color: rgba(255,255,255,.9);
      margin-bottom: 10px;
      font-size: 15px;
    }

    .progress-line {
      height: 13px;
      background: rgba(255,255,255,.13);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-line span {
      height: 100%;
      width: 0%;
      display: block;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--main), var(--gold));
      transition: .35s ease;
    }

    .page {
      min-height: calc(100vh - 170px);
      display: grid;
      place-items: center;
      animation: pageIn .35s ease both;
    }

    @keyframes pageIn {
      from { opacity: 0; transform: translateY(12px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card {
      width: 100%;
      background: linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.065));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      overflow: hidden;
      position: relative;
    }

    .card::before {
      content: "";
      position: absolute;
      width: 360px;
      height: 360px;
      right: -160px;
      top: -160px;
      background: radial-gradient(circle, color-mix(in srgb, var(--main) 55%, transparent), transparent 65%);
      pointer-events: none;
    }

    .card::after {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      left: -135px;
      bottom: -135px;
      background: radial-gradient(circle, rgba(255,210,125,.28), transparent 65%);
      pointer-events: none;
    }

    .card-inner {
      position: relative;
      z-index: 2;
      padding: clamp(22px, 4vw, 42px);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: rgba(255,255,255,.12);
      border: 1px solid var(--border);
      padding: 10px 15px;
      border-radius: 999px;
      color: var(--gold);
      font-weight: 900;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 68px);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -1px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: clamp(28px, 4.3vw, 48px);
      line-height: 1.15;
      font-weight: 900;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 2;
      font-size: 18px;
    }

    .hero-desc {
      margin-top: 18px;
      max-width: 850px;
      font-size: 20px;
    }

    .names {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0 0;
    }

    .pill {
      padding: 12px 16px;
      border-radius: 18px;
      background: rgba(255,255,255,.12);
      border: 1px solid var(--border);
      font-weight: 900;
    }

    .locked-news,
    .question,
    .secret-news {
      margin-top: 20px;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 24px;
      padding: 18px;
      color: rgba(255,255,255,.9);
      font-size: 20px;
      line-height: 2;
      font-weight: 700;
    }

    .locked-news {
      border-color: rgba(255,210,125,.28);
    }

    .locked-news-title {
      color: var(--gold);
      font-weight: 900;
      font-size: 19px;
      margin-bottom: 8px;
    }

    .secret-news {
      border: 1px dashed rgba(255,210,125,.75);
      background: rgba(255,210,125,.11);
      font-weight: 900;
      white-space: pre-line;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .step-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .step-number {
      min-width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: 19px;
      color: #2b0505;
      background: linear-gradient(135deg, var(--main), var(--gold));
      font-weight: 900;
      font-size: 20px;
      box-shadow: 0 14px 26px rgba(255,37,37,.28);
    }

    .step-mini {
      text-align: left;
      color: rgba(255,255,255,.72);
      font-weight: 800;
      line-height: 1.6;
      font-size: 14px;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid rgba(255,255,255,.25);
      outline: none;
      border-radius: 18px;
      padding: 14px 16px;
      background: rgba(0,0,0,.28);
      color: white;
      font-size: 16px;
      font-weight: 800;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.8;
    }

    input::placeholder, textarea::placeholder {
      color: rgba(255,255,255,.45);
    }

    option { color: #111; }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .choice {
      min-height: 70px;
      color: white;
      background: rgba(255,255,255,.11);
      border: 1px solid var(--border);
      box-shadow: none;
      text-align: center;
    }

    .choice.selected {
      color: #2b0505;
      background: linear-gradient(135deg, var(--main2), var(--gold));
    }

    .box-game {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 16px;
    }

    .gift-box {
      min-height: 120px;
      border-radius: 24px;
      color: white;
      background: rgba(255,255,255,.11);
      border: 1px solid var(--border);
      box-shadow: none;
      display: grid;
      place-items: center;
      font-size: 46px;
    }

    .gift-box.selected {
      color: #2b0505;
      background: linear-gradient(135deg, var(--main2), var(--gold));
      transform: translateY(-2px) scale(.98);
    }

    .message {
      min-height: 30px;
      margin-top: 14px;
      font-weight: 900;
      font-size: 16px;
    }

    .message.good { color: var(--green); }
    .message.bad { color: var(--bad); }

    .hint {
      display: none;
      margin-top: 14px;
      padding: 14px 16px;
      background: rgba(255,210,125,.12);
      border: 1px solid rgba(255,210,125,.35);
      border-radius: 18px;
      color: rgba(255,245,220,.95);
      font-weight: 800;
      line-height: 1.8;
    }

    .hint.show {
      display: block;
      animation: pageIn .25s ease both;
    }

    .final-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      margin-top: 18px;
    }

    .mini-card {
      background: linear-gradient(145deg, rgba(255,255,255,.15), rgba(255,255,255,.07));
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 22px;
      backdrop-filter: blur(14px);
      box-shadow: 0 16px 45px rgba(0,0,0,.24);
    }

    .mini-card.full { grid-column: 1 / -1; }

    .mini-card h3 {
      margin: 0 0 12px;
      font-size: 25px;
      color: var(--gold);
    }

    .letter {
      white-space: pre-line;
      font-size: 18px;
      color: rgba(255,255,255,.88);
      line-height: 2.15;
      font-weight: 600;
    }

    audio {
      width: 100%;
      margin-top: 14px;
    }

    .media-list {
      display: grid;
      gap: 14px;
    }

    .media-box {
      overflow: hidden;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.24);
    }

    .media-title {
      padding: 12px 14px;
      font-weight: 900;
      color: var(--gold);
      border-bottom: 1px solid rgba(255,255,255,.11);
    }

    .media-box iframe,
    .media-box video,
    .media-box img {
      width: 100%;
      max-height: 620px;
      object-fit: contain;
      display: block;
      border: 0;
      background: black;
    }

    .media-box iframe,
    .media-box video {
      aspect-ratio: 16 / 9;
    }

    .empty-media {
      padding: 18px;
      line-height: 1.8;
      color: rgba(255,255,255,.75);
      font-weight: 800;
    }

    .memory-list {
      display: grid;
      gap: 10px;
    }

    .memory {
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      padding: 14px;
      line-height: 1.8;
      color: rgba(255,255,255,.88);
      font-weight: 800;
    }

    .footer {
      text-align: center;
      color: rgba(255,255,255,.58);
      font-weight: 900;
      margin-top: 24px;
      line-height: 1.8;
    }

    .admin-panel {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      z-index: 999999;
      overflow: auto;
      padding: 18px;
      backdrop-filter: blur(12px);
    }

    .admin-panel.hidden { display: none; }

    .admin-box {
      width: min(1180px, 100%);
      margin: 0 auto 30px;
      background: linear-gradient(145deg, rgba(40,0,0,.96), rgba(80,0,0,.92));
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 28px;
      box-shadow: 0 25px 90px rgba(0,0,0,.5);
      overflow: hidden;
    }

    .admin-head {
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,.14);
    }

    .admin-title {
      font-weight: 900;
      font-size: 24px;
      color: var(--gold);
    }

    .admin-body { padding: 18px; }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .tab-btn {
      color: white;
      background: rgba(255,255,255,.11);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: none;
      padding: 11px 14px;
      border-radius: 15px;
    }

    .tab-btn.active {
      color: #2b0505;
      background: linear-gradient(135deg, var(--main2), var(--gold));
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .form-grid.one { grid-template-columns: 1fr; }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label {
      font-weight: 900;
      color: rgba(255,255,255,.86);
    }

    .admin-card {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 22px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .admin-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .admin-status {
      margin-top: 12px;
      min-height: 26px;
      color: var(--gold);
      font-weight: 900;
      line-height: 1.7;
    }

    .upload-progress {
      height: 12px;
      background: rgba(255,255,255,.14);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }

    .upload-progress span {
      display: block;
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--main), var(--gold));
      border-radius: 999px;
    }

    .list-item {
      padding: 12px;
      border-radius: 16px;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.12);
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .list-item-title {
      font-weight: 900;
      line-height: 1.7;
    }

    .small {
      font-size: 13px;
      color: rgba(255,255,255,.62);
      line-height: 1.7;
      font-weight: 800;
    }


    .log-toolbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .log-list {
      display: grid;
      gap: 10px;
    }

    .log-item {
      background: rgba(0,0,0,.24);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      padding: 13px;
      line-height: 1.7;
    }

    .log-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .log-type {
      color: #2b0505;
      background: linear-gradient(135deg, var(--main2), var(--gold));
      padding: 5px 10px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 13px;
    }

    .log-time {
      color: rgba(255,255,255,.65);
      font-weight: 800;
      font-size: 13px;
    }

    .log-json {
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
      background: rgba(0,0,0,.28);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 14px;
      padding: 10px;
      color: rgba(255,255,255,.78);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      max-height: 240px;
      overflow: auto;
    }

    @media (max-width: 820px) {
      .topbar,
      .admin-head {
        align-items: stretch;
        flex-direction: column;
      }

      .top-actions {
        flex-direction: column;
        width: 100%;
      }

      .brand,
      .reset-btn,
      button {
        width: 100%;
        justify-content: center;
      }

      .choices,
      .final-grid,
      .box-game,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .buttons,
      .admin-row {
        flex-direction: column;
      }

      .step-head {
        align-items: flex-start;
      }

      .step-mini {
        text-align: right;
      }

      .list-item {
        flex-direction: column;
        align-items: stretch;
      }

      .log-toolbar {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <button class="secret-skip" onclick="secretSkip()" aria-label="secret">.</button>

  <div class="float-area" id="floatArea"></div>
  <div class="confetti-area" id="confettiArea"></div>

  <main class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="brand-logo" id="brandLogo">❤️</div>
        <div id="brandText">رحلة المفاجأة</div>
      </div>

      <div class="top-actions">
        <button class="reset-btn" onclick="openAdminFromSite()">الإدارة</button>
        <button class="reset-btn" onclick="resetJourney()">إعادة الرحلة</button>
      </div>
    </div>

    <div class="progress-box">
      <div class="progress-info">
        <div id="progressLabel">جاهزة البداية</div>
        <div id="progressCount">0 / 14</div>
      </div>
      <div class="progress-line">
        <span id="progressBar"></span>
      </div>
    </div>

    <section id="app"></section>
    <div class="footer" id="footerText"></div>
  </main>

  <section id="adminPanel" class="admin-panel hidden"></section>

  <script src="https://upload-widget.cloudinary.com/latest/global/all.js" type="text/javascript"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getAnalytics, isSupported } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-analytics.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      onSnapshot,
      serverTimestamp,
      collection,
      addDoc,
      query,
      orderBy,
      limit,

    function trimDeep(value) {
      if (value === null || value === undefined) return value;
      if (typeof value === "string") return value.slice(0, 900);
      if (typeof value === "number" || typeof value === "boolean") return value;
      if (Array.isArray(value)) return value.slice(0, 30).map(trimDeep);
      if (typeof value === "object") {
        const out = {};
        Object.keys(value).slice(0, 40).forEach(key => out[key] = trimDeep(value[key]));
        return out;
      }
      return String(value).slice(0, 900);
    }

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function normalizeText(value) {
      return String(value || "")
        .trim()
        .replace(/[ًٌٍَُِّْ]/g, "")
        .replace(/[إأآا]/g, "ا")
        .replace(/ى/g, "ي")
        .replace(/ة/g, "ه")
        .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
        .replace(/\s+/g, " ")
        .toLowerCase();
    }

    function attachMediaTracking() {
      document.querySelectorAll("audio, video").forEach(media => {
        if (media.dataset.trackingReady === "1") return;
        media.dataset.trackingReady = "1";
        media.dataset.lastLogMark = "-1";

        const getTitle = () => {
          const card = media.closest(".mini-card, .media-box");
          const h = card?.querySelector("h3, .media-title");
          return h?.textContent?.trim() || media.tagName.toLowerCase();
        };

        ["play", "pause", "ended", "seeking"].forEach(action => {
          media.addEventListener(action, () => {
            logEvent("media_" + action, {
              title: getTitle(),
              tag: media.tagName.toLowerCase(),
              currentTime: Math.round(media.currentTime || 0),
              duration: Math.round(media.duration || 0),
              src: media.currentSrc || media.src || ""
            });
          });
        });

        media.addEventListener("timeupdate", () => {
          const mark = Math.floor((media.currentTime || 0) / 15);
          if (mark > Number(media.dataset.lastLogMark || -1)) {
            media.dataset.lastLogMark = String(mark);
            logEvent("media_progress", {
              title: getTitle(),
              tag: media.tagName.toLowerCase(),
              currentTime: Math.round(media.currentTime || 0),
              duration: Math.round(media.duration || 0),
              src: media.currentSrc || media.src || ""
            });
          }
        });
      });

      document.querySelectorAll(".media-box iframe").forEach(frame => {
        const box = frame.closest(".media-box");
        if (!box || box.dataset.youtubeTrackingReady === "1") return;
        box.dataset.youtubeTrackingReady = "1";
        box.addEventListener("click", () => {
          logEvent("youtube_click", {
            title: box.querySelector(".media-title")?.textContent?.trim() || "YouTube",
            src: frame.src || ""
          });
        }, true);
      });
    }

    function renderMediaItem(item) {
      const title = esc(item.title || "ملف");
      const url = esc(item.url || "");

      if (!url) {
        return `
          <div class="media-box">
            <div class="media-title">${title}</div>
            <div class="empty-media">هذا العنصر بدون رابط. ارفع الملف أو حط الرابط من الإدارة.</div>
          </div>
        `;
      }

      if (item.type === "youtube") {
        const id = getYouTubeId(item.url);
        return `
          <div class="media-box">
            <div class="media-title">${title}</div>
            <iframe src="https://www.youtube.com/embed/${esc(id)}" allowfullscreen></iframe>
          </div>
        `;
      }

      if (item.type === "image") {
        return `
          <div class="media-box">
            <div class="media-title">${title}</div>
            <img src="${url}" alt="${title}">
          </div>
        `;
      }

      return `
        <div class="media-box">
          <div class="media-title">${title}</div>
          <video controls src="${url}"></video>
        </div>
      `;
    }

    function getYouTubeId(value) {
      const v = String(value || "").trim();
      if (!v.includes("youtube") && !v.includes("youtu.be")) return v;
      try {
        const url = new URL(v);
        if (url.hostname.includes("youtu.be")) return url.pathname.replace("/", "");
        return url.searchParams.get("v") || v;
      } catch {
        return v;
      }
    }

    function miniConfetti() {
      const area = document.getElementById("confettiArea");
      const colors = ["#ff2525", "#ff6868", "#ffd27d", "#ffffff", "#85ffbd"];

      for (let i = 0; i < 28; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti";
        piece.style.left = Math.random() * 100 + "%";
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = (1.2 + Math.random() * 1.2) + "s";
        piece.style.transform = `rotate(${Math.random() * 180}deg)`;
        area.appendChild(piece);
        setTimeout(() => piece.remove(), 2600);
      }
    }

    function fireConfetti() {
      const area = document.getElementById("confettiArea");
      const colors = ["#ff2525", "#ff6868", "#b30000", "#ffd27d", "#ffffff", "#85ffbd"];

      for (let i = 0; i < 85; i++) {

    async function uploadSelectedFile() {
      const title = val("uploadTitle");
      const target = val("uploadTarget");
      const bar = document.getElementById("uploadBar");
      const status = document.getElementById("uploadStatus");

      if (!CLOUDINARY_CLOUD_NAME || !CLOUDINARY_UPLOAD_PRESET) {
        status.textContent = "بيانات Cloudinary ناقصة داخل الكود.";
        return;
      }

      if (!window.cloudinary || !window.cloudinary.createUploadWidget) {
        status.textContent = "نافذة Cloudinary ما تحمّلت. حدث الصفحة وجرب.";
        return;
      }

      bar.style.width = "0%";
      status.textContent = "افتح نافذة الرفع واختر الملف. للمقاطع الطويلة انتظر لين يخلص 100%.";

      const widget = window.cloudinary.createUploadWidget({
        cloudName: CLOUDINARY_CLOUD_NAME,
        uploadPreset: CLOUDINARY_UPLOAD_PRESET,
        sources: ["local", "camera", "url", "google_drive"],
        multiple: false,
        resourceType: "auto",
        folder: "love-site",
        maxChunkSize: 6000000,
        clientAllowedFormats: ["png", "jpg", "jpeg", "webp", "gif", "mp4", "mov", "webm", "m4v", "mp3", "m4a", "wav", "aac", "ogg"],
        showAdvancedOptions: false,
        showPoweredBy: false,
        styles: {
          palette: {
            window: "#170000",
            sourceBg: "#250000",
            windowBorder: "#ff6b6b",
            tabIcon: "#ffd27d",
            inactiveTabIcon: "#ffffff",
            menuIcons: "#ffd27d",
            link: "#ffd27d",
            action: "#ff2525",
            inProgress: "#ffd27d",
            complete: "#8dffbc",
            error: "#ffc0c0",
            textDark: "#ffffff",
            textLight: "#ffffff"
          }
        }
      }, async (error, result) => {
        if (error) {
          console.error(error);
          status.textContent = "فشل الرفع: " + (error.message || JSON.stringify(error));
          bar.style.width = "0%";
          return;
        }

        if (!result) return;

        if (result.event === "queues-start") {
          status.textContent = "بدأ الرفع، لا تقفل الصفحة...";
          bar.style.width = "15%";
        }

        if (result.event === "upload-added") {
          status.textContent = "تم اختيار الملف وجاري الرفع...";
          bar.style.width = "25%";
        }

        if (result.event === "success") {
          const info = result.info || {};
          const url = info.secure_url || info.url || "";

          if (!url) {
            status.textContent = "تم الرفع لكن الرابط ما رجع.";
            return;
          }

          const resourceType = info.resource_type || "";
          const format = String(info.format || "").toLowerCase();
          const isImage = resourceType === "image";
          const isAudio = ["mp3", "m4a", "wav", "aac", "ogg"].includes(format);

          if (target === "logo") {
            if (!isImage) {
              status.textContent = "الشعار لازم يكون صورة. الملف انرفع، لكن ما جعلته شعار.";
              return;
            }
            SITE.logoUrl = url;
          } else if (target === "shareImage") {
            if (!isImage) {
              status.textContent = "صورة المشاركة لازم تكون صورة. الملف انرفع، لكن ما جعلته صورة مشاركة.";
              return;
            }
            SITE.shareImageUrl = url;
          } else if (target === "song") {
            SITE.songUrl = url;
          } else {
            SITE.media = SITE.media || [];
            SITE.media.push({
              title: title || info.original_filename || "ملف مرفوع",
              type: isImage ? "image" : "video",
              url
            });
          }

          await saveConfig(SITE);
          status.textContent = "تم الرفع والحفظ بنجاح، وظهر عند الكل.";
          bar.style.width = "100%";
          renderAdminMedia();
        }

        if (result.event === "abort") {
          status.textContent = "تم إلغاء الرفع.";
          bar.style.width = "0%";
        }
      });

      widget.open();
    }

        .map(line => {

          return {
            icon: (icon || "🎁").trim(),
            value: (rest.join("|") || icon || "قيمة").trim()
          };

        .map(x => x.trim())
        .filter(Boolean)
        .map(line => {
          const [title, ...rest] = line.split("|");
          return {
            title: (title || "قسم جديد").trim(),
            content: (rest.join("|") || "").trim()

    async function askAIToEdit(applyNow = false) {
      const workerUrl = val("aiWorkerUrl").trim();
      const token = val("aiAdminToken").trim();
      const instruction = val("aiPrompt").trim();

      if (!workerUrl) {
        setAIStatus("حط رابط Cloudflare Worker أول.", false);
        return;
      }

      if (!token) {
        setAIStatus("حط رمز الإدارة للذكاء الاصطناعي.", false);
        return;
      }

      if (!instruction) {
        setAIStatus("اكتب طلبك للذكاء أول.", false);
        return;
      }

      localStorage.setItem("ai_worker_url", workerUrl);
      localStorage.setItem("ai_admin_token", token);

      setAIStatus("جاري إرسال الطلب للذكاء الاصطناعي...");

      try {
        const response = await fetch(workerUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({
            instruction,
            currentSite: SITE
          })
        });

        const text = await response.text();

        if (!response.ok) {
          throw new Error(text || `HTTP ${response.status}`);
        }

        const data = JSON.parse(text);
        aiPreviewSite = sanitizeAISite(data.site || data);

        document.getElementById("aiPreview").value = JSON.stringify(aiPreviewSite, null, 2);

        if (applyNow) {
          await applyAIPreview();
        } else {
          setAIStatus(data.message || "تم توليد التعديل. راجع المعاينة ثم اضغط تطبيق.");
        }
      } catch (err) {
        console.error(err);
        setAIStatus("فشل طلب الذكاء: " + err.message, false);
      }
    }

    function sanitizeAISite(site) {
      const merged = mergeSite(DEFAULT_SITE, site || {});
      merged.tests = Array.isArray(merged.tests) ? merged.tests : [];
      merged.media = Array.isArray(merged.media) ? merged.media : [];
      merged.memories = Array.isArray(merged.memories) ? merged.memories : [];
      merged.customSections = Array.isArray(merged.customSections) ? merged.customSections : [];
      return merged;
    }

    async function applyAIPreview() {
      try {
        const previewBox = document.getElementById("aiPreview");
        const raw = previewBox?.value?.trim();

        if (raw) {
          aiPreviewSite = sanitizeAISite(JSON.parse(raw));
        }

        if (!aiPreviewSite) {
          setAIStatus("ما فيه معاينة لتطبيقها.", false);
          return;
        }

        SITE = aiPreviewSite;
        await saveConfig(SITE);
        setAIStatus("تم تطبيق تعديل الذكاء وحفظه سحابيًا. ظهر عند الكل.");
      } catch (err) {
        console.error(err);
        setAIStatus("فشل تطبيق المعاينة: " + err.message, false);
      }
    }

    function renderLogsList() {
      const box = document.getElementById("logsList");
      if (!box) return;

      const search = (document.getElementById("logSearch")?.value || "").trim().toLowerCase();
      let logs = latestLogs || [];

      if (search) {
        logs = logs.filter(item => JSON.stringify(item).toLowerCase().includes(search));
      }

      if (!logs.length) {
        box.innerHTML = `<div class="empty-media">لا يوجد سجل مطابق.</div>`;
        return;
      }

      box.innerHTML = logs.map(item => {
        const time = item.createdAtMs ? new Date(item.createdAtMs).toLocaleString("ar-SA") : "وقت غير معروف";
        const details = JSON.stringify(item.details || {}, null, 2);
        return `
          <div class="log-item">
            <div class="log-top">
              <span class="log-type">${esc(item.type || "event")}</span>
              <span class="log-time">${esc(time)} — جلسة: ${esc(item.sessionId || "")}</span>
            </div>
            <div class="small">
              المرحلة: ${esc(item.currentStep ?? "")} — ${esc(item.stepTitle || "")}<br>
              الصفحة: ${esc(item.pageHash || "")}
            </div>
            <div class="log-json">${esc(details)}</div>
          </div>
        `;
      }).join("");
    }

    async function copyLogs() {
      const text = JSON.stringify(latestLogs || [], null, 2);
      await navigator.clipboard.writeText(text);
      setAdminStatus("تم نسخ السجل.");
    }

    async function clearAllLogs() {
      if (!confirm("متأكد تحذف السجل؟")) return;

      try {
        let deleted = 0;
        const snap = await getDocs(query(eventsCol, limit(500)));
        for (const d of snap.docs) {
          await deleteDoc(d.ref);
          deleted++;
        }
        setAdminStatus(`تم حذف ${deleted} حدث من السجل. كرر الحذف إذا كان السجل أكبر من 500.`);
      } catch (err) {
        console.error(err);
        setAdminStatus("فشل حذف السجل: " + err.message, false);
      }
    }

    function renderAdminBackup() {
      document.getElementById("adminContent").innerHTML = `
        <div class="admin-card">
          <h3 style="margin-top:0;color:var(--gold)">نسخة احتياطية</h3>
          <p class="small">انسخ البيانات قبل أي تعديل كبير. تقدر ترجعها بأي وقت.</p>
          <textarea id="backupText" style="min-height:360px" dir="ltr">${esc(JSON.stringify(SITE, null, 2))}</textarea>
          <div class="buttons">
            <button onclick="copyBackup()">نسخ</button>
            <button class="secondary" onclick="restoreBackup()">استرجاع من النص</button>
            <button class="danger" onclick="resetCloudDefault()">إرجاع الافتراضي</button>
          </div>
        </div>
      `;
    }

    async function copyBackup() {
      const text = val("backupText");
      await navigator.clipboard.writeText(text);
      setAdminStatus("تم نسخ النسخة الاحتياطية.");
    }

    function restoreBackup() {
      try {
        const parsed = JSON.parse(val("backupText"));
        SITE = mergeSite(DEFAULT_SITE, parsed);
        saveConfig(SITE).then(() => renderAdmin("تم استرجاع النسخة."));
      } catch (err) {
        setAdminStatus("النص ليس JSON صحيح.", false);
      }
    }

    function resetCloudDefault() {
      if (!confirm("متأكد ترجع كل شيء للوضع الافتراضي؟")) return;
      SITE = structuredCloneSafe(DEFAULT_SITE);
      saveConfig(SITE).then(() => renderAdmin("تم إرجاع الافتراضي."));
    }

    function val(id) {
      return document.getElementById(id)?.value || "";
    }

    function lines(id) {
      return val(id)
        .split("\n")
        .map(x => x.trim())
        .filter(Boolean);
    }

    makeHearts();

    if (new URLSearchParams(location.search).has("admin")) {
      adminOpen = true;
      renderAdmin();
    }

    window.setStep = setStep;
    window.resetJourney = resetJourney;
    window.secretSkip = secretSkip;
    window.checkTextAnswer = checkTextAnswer;
    window.checkChoiceAnswer = checkChoiceAnswer;
    window.checkBoxAnswer = checkBoxAnswer;
    window.showHint = showHint;
    window.fireConfetti = fireConfetti;

    window.openAdminFromSite = openAdminFromSite;
    window.closeAdmin = closeAdmin;
    window.adminLogin = adminLogin;
    window.logoutAdmin = logoutAdmin;
    window.setAdminTab = setAdminTab;
    window.askAIToEdit = askAIToEdit;
    window.applyAIPreview = applyAIPreview;
    window.saveAll = saveAll;
    window.saveGeneral = saveGeneral;
    window.saveFinal = saveFinal;
    window.uploadSelectedFile = uploadSelectedFile;
    window.addManualMedia = addManualMedia;
    window.removeMedia = removeMedia;
    window.moveMedia = moveMedia;
    window.editTest = editTest;
    window.addTest = addTest;
    window.saveTestEditor = saveTestEditor;
    window.deleteTest = deleteTest;
    window.moveTest = moveTest;
    window.renderLogsList = renderLogsList;
    window.copyLogs = copyLogs;
    window.clearAllLogs = clearAllLogs;
    window.copyBackup = copyBackup;
    window.restoreBackup = restoreBackup;
    window.resetCloudDefault = resetCloudDefault;
  </script>
</body>
</html>
